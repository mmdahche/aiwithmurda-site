<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI with Murda - Privacy Mode</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050807;
        color: #f4f7f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background-color: #050807;
        background-image:
          linear-gradient(rgba(88, 235, 111, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(88, 235, 111, 0.055) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      body::before {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 18% 20%, rgba(88, 235, 111, 0.12), transparent 30%),
          radial-gradient(circle at 82% 78%, rgba(241, 190, 59, 0.1), transparent 32%);
        content: "";
      }

      .frame {
        position: absolute;
        inset: 32px;
        border: 1px solid rgba(88, 235, 111, 0.35);
      }

      .corner {
        position: absolute;
        width: 34px;
        height: 34px;
        border-color: #58eb6f;
        border-style: solid;
      }

      .corner.top-left {
        top: -1px;
        left: -1px;
        border-width: 3px 0 0 3px;
      }

      .corner.top-right {
        top: -1px;
        right: -1px;
        border-width: 3px 3px 0 0;
      }

      .corner.bottom-left {
        bottom: -1px;
        left: -1px;
        border-width: 0 0 3px 3px;
      }

      .corner.bottom-right {
        right: -1px;
        bottom: -1px;
        border-width: 0 3px 3px 0;
      }

      header,
      footer {
        position: absolute;
        right: 68px;
        left: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        text-transform: uppercase;
      }

      header {
        top: 58px;
      }

      footer {
        bottom: 58px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid #58eb6f;
        color: #58eb6f;
        font-size: 17px;
      }

      .system-label,
      .footer-note {
        color: #9eaaa3;
        font-size: 13px;
        letter-spacing: 0;
      }

      main {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 110px;
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-self: center;
        gap: 10px;
        margin-bottom: 28px;
        color: #58eb6f;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #58eb6f;
        box-shadow: 0 0 18px rgba(88, 235, 111, 0.85);
        animation: pulse 1.7s ease-in-out infinite;
      }

      h1 {
        max-width: 980px;
        margin: 0;
        font-size: clamp(70px, 9vw, 126px);
        font-weight: 900;
        line-height: 0.88;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 span {
        color: #58eb6f;
      }

      .message {
        max-width: 640px;
        margin: 34px auto 0;
        color: #c2cbc6;
        font-size: 23px;
        line-height: 1.45;
      }

      .track {
        position: relative;
        width: min(520px, 48vw);
        height: 2px;
        margin: 38px auto 0;
        overflow: hidden;
        background: rgba(244, 247, 245, 0.14);
      }

      .track::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        background: #f1be3b;
        content: "";
        animation: progress 2.8s ease-in-out infinite;
      }

      .protected {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #f1be3b;
        font-size: 13px;
        font-weight: 700;
      }

      .protected-icon {
        width: 9px;
        height: 12px;
        border: 1px solid currentColor;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.86);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes progress {
        0% {
          left: -45%;
        }

        100% {
          left: 105%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot,
        .track::after {
          animation: none;
        }

        .track::after {
          left: 29%;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-hidden="true">
      <span class="corner top-left"></span>
      <span class="corner top-right"></span>
      <span class="corner bottom-left"></span>
      <span class="corner bottom-right"></span>
    </div>

    <header>
      <div class="brand">
        <span class="brand-mark">&lt;/&gt;</span>
        <span>AI with Murda</span>
      </div>
      <div class="system-label">60-Day AI Operator Sprint</div>
    </header>

    <main>
      <div class="status"><span class="status-dot"></span>Stream protected</div>
      <h1>Privacy <span>Mode</span></h1>
      <p class="message">Sensitive setup in progress. The live build continues shortly.</p>
      <div class="track" aria-hidden="true"></div>
    </main>

    <footer>
      <div class="footer-note">Built live. Shipped in public.</div>
      <div class="protected"><span class="protected-icon"></span>Private screen active</div>
    </footer>
  </body>
</html>
